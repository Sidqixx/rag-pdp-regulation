name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  # Guards retrieval quality: fails if a change to parsing, chunking or retrieval drops recall@5.
  # Uses the production embedding model, so it needs the GEMINI_API_KEY repository secret (skipped without it).
  retrieval-eval:
    runs-on: ubuntu-latest
    env:
      EMBED_BASE_URL: https://generativelanguage.googleapis.com/v1beta/openai/
      EMBED_MODEL: gemini-embedding-2
      EMBED_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - if: env.EMBED_API_KEY == ''
        run: echo "::notice::GEMINI_API_KEY secret is not set, skipping the retrieval eval"
      - if: env.EMBED_API_KEY != ''
        uses: actions/checkout@v4
      - if: env.EMBED_API_KEY != ''
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - if: env.EMBED_API_KEY != ''
        run: pip install -r requirements.txt
      - if: env.EMBED_API_KEY != ''
        run: python -m ragpdp.evaluate --min-recall 0.9
