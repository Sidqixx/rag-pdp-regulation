# Deploy gratis di Render (Blueprint). API key diisi di dashboard Render saat setup (sync: false), tidak ditulis di sini.
services:
  - type: web
    name: rag-pdp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn ragpdp.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CHAT_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: CHAT_MODEL
        value: gemini-3.5-flash-lite
      - key: CHAT_REASONING_EFFORT
        value: minimal
      - key: EMBED_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: EMBED_MODEL
        value: gemini-embedding-2
      - key: CHAT_API_KEY
        sync: false
      - key: EMBED_API_KEY
        sync: false
