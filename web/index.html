<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tanya UU PDP</title>
<style>
  :root { --bg:#f7f7f5; --fg:#1c1c1c; --muted:#666; --card:#fff; --border:#ddd; --accent:#0b5cad; --bad:#b3261e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#151515; --fg:#eee; --muted:#aaa; --card:#1f1f1f; --border:#333; --accent:#6fb1ff; --bad:#ff8a80; } }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.55 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:760px; margin:0 auto; padding:16px; display:flex; flex-direction:column; min-height:100vh; }
  header h1 { font-size:1.4rem; margin:8px 0 4px; }
  header p { margin:0 0 12px; color:var(--muted); font-size:.9rem; }
  #log { flex:1; display:flex; flex-direction:column; gap:12px; }
  .msg { padding:12px 14px; border-radius:10px; background:var(--card); border:1px solid var(--border); white-space:pre-wrap; }
  .user { align-self:flex-end; background:var(--accent); color:#fff; border:none; max-width:85%; }
  .cite { font-size:.85em; padding:0 4px; border-radius:4px; border:1px solid var(--accent); color:var(--accent); text-decoration:none; white-space:nowrap; }
  .cite.bad { border-color:var(--bad); color:var(--bad); text-decoration:line-through; }
  .sources { margin-top:10px; white-space:normal; font-size:.9rem; }
  details { border-top:1px solid var(--border); padding:6px 0; }
  summary { cursor:pointer; color:var(--accent); }
  details div { white-space:pre-wrap; color:var(--fg); margin-top:6px; }
  details .pj { color:var(--muted); }
  #examples { display:flex; flex-wrap:wrap; gap:8px; margin:8px 0; }
  #examples button, form button { font:inherit; border:1px solid var(--border); background:var(--card); color:var(--fg); border-radius:999px; padding:6px 12px; cursor:pointer; }
  form { display:flex; gap:8px; position:sticky; bottom:0; padding:12px 0; background:var(--bg); }
  form input { flex:1; font:inherit; padding:10px 12px; border-radius:10px; border:1px solid var(--border); background:var(--card); color:var(--fg); }
  form button { border-radius:10px; background:var(--accent); color:#fff; border:none; }
  form button:disabled { opacity:.5; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Tanya UU PDP</h1>
    <p>Penjelasan UU 27/2022 tentang Pelindungan Data Pribadi dan PP 33/2026, lengkap dengan pasal sumbernya. Bukan nasihat hukum. Jangan masukkan data pribadi (NIK, nomor HP, dll.): pertanyaan bisa diproses layanan AI pihak ketiga.</p>
  </header>
  <div id="examples">
    <button type="button">Data pribadi apa aja yang dianggap sensitif?</button>
    <button type="button">Kalau data gua bocor, perusahaan wajib ngapain?</button>
    <button type="button">Apa sanksinya kalau jual beli data pribadi?</button>
  </div>
  <div id="log" aria-live="polite"></div>
  <form id="form">
    <label for="q" hidden>Pertanyaan</label>
    <input id="q" autocomplete="off" maxlength="1000" placeholder="Tulis pertanyaan tentang data pribadi..." required>
    <button>Kirim</button>
  </form>
</main>
<script>
const log = document.getElementById('log'), form = document.getElementById('form'), input = document.getElementById('q');
const history = [];
let n = 0;

const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// Sama dengan CITE di ragpdp/answer.py: "[UU 27/2022 Pasal 4 ayat (1)]" atau "Pasal 4 ayat (1) UU No. 27 Tahun 2022".
const DOC = String.raw`(UU(?: No\.?)? 27(?:\/| Tahun )2022|PP(?: No\.?)? 33(?:\/| Tahun )2026)`;
const DETAIL = String.raw`(?: [Aa]yat \(\d+\))?(?: [Hh]uruf [a-z])?`;
const CITE = String.raw`\[?${DOC} Pasal (\d+)${DETAIL}\]?|Pasal (\d+)${DETAIL} ${DOC}`;
const citeLabel = (d1, n1, n2, d2) => `${(d1 || d2).startsWith('UU') ? 'UU 27/2022' : 'PP 33/2026'} Pasal ${n1 || n2}`;
const cidOf = (id, label) => `${id}-${label.replace(/\W/g, '')}`;

function render(text, sources, id) {
  const ok = new Set(sources.map(s => s.label));
  return esc(text)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(new RegExp(CITE, 'g'), (m, d1, n1, n2, d2) => {
      const l = citeLabel(d1, n1, n2, d2), shown = m.replace(/^\[|\]$/g, '');
      return ok.has(l)
        ? `<a class="cite" href="#${cidOf(id, l)}">${shown}</a>`
        : `<span class="cite bad" title="Pasal ini tidak ada di sumber yang diambil, jangan dipercaya">${shown}</span>`;
    });
}

function sourcesHtml(text, sources, id) {
  const item = s => `<details id="${cidOf(id, s.label)}"><summary>${esc(s.label)} &middot; ${esc(s.bab)}</summary>` +
    `<div>${esc(s.text)}</div>` + (s.penjelasan ? `<div class="pj">Penjelasan:\n${esc(s.penjelasan)}</div>` : '') + '</details>';
  const citedSet = new Set([...text.matchAll(new RegExp(CITE, 'g'))].map(m => citeLabel(m[1], m[2], m[3], m[4])));
  const cited = s => citedSet.has(s.label);
  const used = sources.filter(cited), other = sources.filter(s => !cited(s));
  return '<div class="sources">' +
    (used.length ? '<strong>Sumber</strong>' + used.map(item).join('') : '') +
    (other.length ? `<details><summary>Pasal lain yang ikut dibaca (${other.length})</summary>${other.map(item).join('')}</details>` : '') +
    '</div>';
}

function add(cls, text) {
  const el = document.createElement('div');
  el.className = 'msg ' + cls;
  el.textContent = text;
  log.append(el);
  el.scrollIntoView({block: 'end'});
  return el;
}

async function ask(q) {
  add('user', q);
  const id = 'm' + (n++), bot = add('bot', 'Mencari pasal...');
  form.querySelector('button').disabled = true;
  let sources = [], text = '', buf = '';
  try {
    const res = await fetch('/api/ask', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({question: q, history})});
    if (!res.ok) throw new Error(res.status);
    const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
    for (let header = true;;) {
      const {value, done} = await reader.read();
      if (done) break;
      if (header) {
        buf += value;
        const nl = buf.indexOf('\n');
        if (nl < 0) continue;
        sources = JSON.parse(buf.slice(0, nl)).sources;
        text = buf.slice(nl + 1);
        header = false;
      } else text += value;
      bot.innerHTML = render(text, sources, id);
    }
    bot.innerHTML = render(text, sources, id) + sourcesHtml(text, sources, id);
    history.push({role: 'user', content: q}, {role: 'assistant', content: text});
  } catch (e) {
    bot.textContent = 'Maaf, terjadi kesalahan. Coba lagi sebentar lagi.';
  }
  form.querySelector('button').disabled = false;
}

log.addEventListener('click', e => {
  const a = e.target.closest('a.cite');
  if (a) document.querySelector(a.getAttribute('href'))?.setAttribute('open', '');
});
form.addEventListener('submit', e => { e.preventDefault(); const q = input.value.trim(); input.value = ''; if (q) ask(q); });
document.querySelectorAll('#examples button').forEach(b => b.addEventListener('click', () => ask(b.textContent)));
</script>
</body>
</html>
